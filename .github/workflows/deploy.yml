name: Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Sudoku logic
        run: npm test

      - name: Generate local Sudoku fixture
        run: npm run generate:sudoku-dev

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform only
        run: |
          terraform -chdir=infra/terraform/aws init -backend=false
          terraform -chdir=infra/terraform/aws fmt -check
          terraform -chdir=infra/terraform/aws validate

      - name: Build site
        run: hugo --minify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-hugo-deploy
          mask-aws-account-id: true

      - name: Sync to S3
        run: aws s3 sync public/ "s3://${{ vars.S3_BUCKET_NAME }}" --delete --exact-timestamps

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
